<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流动星空生日贺卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        body {
            background: linear-gradient(to bottom, #0a0a0a 0%, #222222 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            z-index: 0;
            animation: starFlow 60s linear infinite;
            -webkit-animation: starFlow 60s linear infinite;
        }
        #enterBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 45px;
            background: #888;
            color: white;
            border: 2px solid white;
            border-radius: 0;
            font-size: 20px;
            cursor: pointer;
            z-index: 9999;
            outline: none;
            display: block;
            pointer-events: auto;
        }
        #enterBtn:hover {
            background: #666;
        }
        .text-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            height: 300px;
            margin: 50px auto 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            line-height: 1.8;
            overflow-y: auto;
            z-index: 10;
            text-align: left;
        }
        .text-container::-webkit-scrollbar {
            width: 8px;
        }
        .text-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        #popupBtn {
            display: block;
            margin: 0 auto 50px;
            padding: 12px 30px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            position: relative;
            outline: none;
        }
        #popupBtn:hover {
            background: #3182ce;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }
        .popup {
            position: fixed;
            width: 200px;
            height: 80px;
            padding: 15px;
            padding-top: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #333;
            z-index: 9998;
            top: 0;
            left: 0;
        }
        .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            color: #666;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        .close-btn:hover {
            background: rgba(0,0,0,0.2);
            color: #333;
        }
        .content-wrapper {
            display: none;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .content-wrapper.active {
            display: block;
            visibility: visible;
            opacity: 1;
        }
        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        @keyframes starFlow {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }
        @-webkit-keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        @-webkit-keyframes starFlow {
            0% { -webkit-transform: translateY(0); }
            100% { -webkit-transform: translateY(-100%); }
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    <button id="enterBtn">点击进入</button>
    <div class="content-wrapper" id="contentWrapper">
        <div class="text-container" id="birthdayText"></div>
        <button id="popupBtn">点击生成生日祝福弹窗</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 生成星空
            const stars = document.getElementById('stars');
            function createStars() {
                if (!stars) return;
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement('div');
                    star.style.position = 'absolute';
                    star.style.width = `${Math.random() * 3 + 1}px`;
                    star.style.height = star.style.width;
                    star.style.backgroundColor = 'white';
                    star.style.borderRadius = '50%';
                    star.style.opacity = Math.random() * 0.8 + 0.2;
                    star.style.animation = star.style.webkitAnimation = 'twinkle ' + (Math.random() * 3 + 2) + 's infinite alternate';
                    star.style.top = `${Math.random() * window.innerHeight * 2}px`;
                    star.style.left = `${Math.random() * window.innerWidth}px`;
                    stars.appendChild(star);
                }
            }
            createStars();

            // 贺卡内容
            const birthdayContent = `🎂 亲爱的小伙伴，生日快乐！🎂

愿你的世界里，
星光温柔，晚风轻拂，
所有美好都如期而至。

愿你每一岁都奔走在热爱里，
平安喜乐，万事胜意，
眼里有光，心中有爱，
未来的日子闪闪发光！

愿友谊长存，
快乐无限，
生日安康，岁岁欢愉！
`;

            // 进入贺卡逻辑
            const enterBtn = document.getElementById('enterBtn');
            const contentWrapper = document.getElementById('contentWrapper');
            const birthdayText = document.getElementById('birthdayText');
            let isTyped = false;

            if (enterBtn) {
                enterBtn.addEventListener('click', function() {
                    enterBtn.style.display = 'none';
                    enterBtn.style.pointerEvents = 'none';
                    contentWrapper.classList.add('active');

                    if (!isTyped && birthdayText) {
                        let index = 0;
                        const typeInterval = setInterval(function() {
                            if (index < birthdayContent.length) {
                                birthdayText.textContent += birthdayContent[index];
                                index++;
                                birthdayText.scrollTop = birthdayText.scrollHeight;
                            } else {
                                clearInterval(typeInterval);
                                isTyped = true;
                            }
                        }, 100);
                    }
                });
            }

            // 弹窗功能
            const popupBtn = document.getElementById('popupBtn');
            const popupTexts = [
                "生日快乐！暴富暴美～",
                "新岁无忧，岁岁欢愉",
                "愿你被世界温柔以待",
                "生日限定，快乐无限",
                "平安喜乐，得偿所愿",
                "又长大一岁，继续发光",
                "三餐四季，温柔有趣",
                "永远少女心，永远快乐",
                "解锁人生新章节，万事顺意",
                "美好和幸运都围绕着你",
                "生日安康，喜乐常伴",
                "今天你是主角，要超快乐",
                "岁岁平安，年年有我",
                "梦想开花，未来可期",
                "温柔以待，好运常在"
            ];
            const softColors = [
                '#f0f8fb', '#f5fafe', '#fdf2f8', '#fef7fb',
                '#f5f5f5', '#f8f8f8', '#faf6ed', '#f7f3e9',
                '#eaf6fa', '#f0f8e8', '#fcf1f7', '#f5fafe'
            ];
            let isGenerating = false;
            let popupInterval;

            if (popupBtn) {
                popupBtn.addEventListener('click', function() {
                    if (!isGenerating) {
                        popupBtn.textContent = "停止生成祝福";
                        isGenerating = true;
                        popupInterval = setInterval(createPopup, 100);
                    } else {
                        popupBtn.textContent = "点击生成生日祝福弹窗";
                        isGenerating = false;
                        clearInterval(popupInterval);
                    }
                });
            }

            function createPopup() {
                const popup = document.createElement('div');
                popup.className = 'popup';
                const maxTop = window.innerHeight - 100;
                const maxLeft = window.innerWidth - 220;
                const randomTop = Math.floor(Math.random() * maxTop);
                const randomLeft = Math.floor(Math.random() * maxLeft);
                popup.style.top = randomTop + 'px';
                popup.style.left = randomLeft + 'px';

                const closeBtn = document.createElement('button');
                closeBtn.className = 'close-btn';
                closeBtn.textContent = '×';
                closeBtn.addEventListener('click', function() {
                    popup.style.opacity = '0';
                    popup.style.transition = 'opacity 0.5s';
                    setTimeout(() => popup.parentNode?.removeChild(popup), 500);
                });

                const textIndex = Math.floor(Math.random() * popupTexts.length);
                const colorIndex = Math.floor(Math.random() * softColors.length);
                popup.textContent = popupTexts[textIndex];
                popup.style.backgroundColor = softColors[colorIndex];
                popup.appendChild(closeBtn);
                document.body.appendChild(popup);
            }

            window.addEventListener('resize', function() {
                if (stars) {
                    stars.innerHTML = '';
                    createStars();
                }
            });
        });
    </script>
</body>
</html>
