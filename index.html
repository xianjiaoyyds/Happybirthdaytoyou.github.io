<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流动星空生日贺卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 背景：黑色渐变灰色 + 流动星空 */
        body {
            background: linear-gradient(to bottom, #0a0a0a 0%, #222222 100%);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.5s;
            /* 修复GitHub环境下的层叠问题 */
            position: relative;
        }
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            z-index: 0;
            animation: starFlow 60s linear infinite;
        }

        /* 首页进入按钮：增强点击区域，修复层叠 */
        #enterBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 45px;
            background: #888;
            color: white;
            border: 2px solid white;
            border-radius: 0;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.3s;
            z-index: 9999; /* 提升层级，避免被遮挡 */
            outline: none;
            /* 修复GitHub下点击区域失效 */
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        #enterBtn:hover {
            background: #666;
        }

        /* 加载文字容器：宽度适配GitHub Pages */
        .text-container {
            position: relative;
            width: 90%; /* 改为百分比，适配不同屏幕 */
            max-width: 450px; /* 保留最大宽度 */
            height: 300px;
            margin: 50px auto 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            line-height: 1.8;
            overflow-y: auto;
            z-index: 10;
            text-align: left;
        }
        .text-container::-webkit-scrollbar {
            width: 8px;
        }
        .text-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        /* 弹窗功能按钮：增强层级 */
        #popupBtn {
            display: block;
            margin: 0 auto 50px;
            padding: 12px 30px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
            position: relative;
            outline: none;
        }
        #popupBtn:hover {
            background: #3182ce;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }

        /* 弹窗样式：固定大小+柔和背景+关闭按钮 */
        .popup {
            position: fixed;
            width: 200px;
            height: 80px;
            padding: 15px;
            padding-top: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #333;
            z-index: 9998;
            top: 0;
            left: 0;
        }

        /* 弹窗关闭按钮 */
        .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            color: #666;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            outline: none;
        }
        .close-btn:hover {
            background: rgba(0,0,0,0.2);
            color: #333;
        }

        /* 内容容器：修复GitHub下显示问题 */
        .content-wrapper {
            display: none;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .content-wrapper.active {
            display: block;
            visibility: visible;
            opacity: 1;
        }

        /* 星星动画：修复GitHub下动画失效 */
        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        @keyframes starFlow {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }
        /* 兼容GitHub Pages动画前缀 */
        @-webkit-keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        @-webkit-keyframes starFlow {
            0% { -webkit-transform: translateY(0); }
            100% { -webkit-transform: translateY(-100%); }
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    <button id="enterBtn">点击进入生日贺卡</button>
    <div class="content-wrapper" id="contentWrapper">
        <div class="text-container" id="birthdayText"></div>
        <button id="popupBtn">点击生成生日祝福弹窗</button>
    </div>

    <script>
        // 核心修复：避免GitHub Pages的DOM加载顺序问题
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 生成流动星空
            const stars = document.getElementById('stars');
            function createStars() {
                if (!stars) return;
                for (let i = 0; i < 200; i++) {
                    const star = document.createElement('div');
                    star.style.position = 'absolute';
                    star.style.width = `${Math.random() * 3 + 1}px`;
                    star.style.height = star.style.width;
                    star.style.backgroundColor = 'white';
                    star.style.borderRadius = '50%';
                    star.style.opacity = Math.random() * 0.8 + 0.2;
                    // 兼容前缀动画
                    star.style.animation = star.style.webkitAnimation = 
                        'twinkle ' + (Math.random() * 3 + 2) + 's infinite alternate';
                    star.style.top = `${Math.random() * window.innerHeight * 2}px`;
                    star.style.left = `${Math.random() * window.innerWidth}px`;
                    stars.appendChild(star);
                }
            }
            createStars();

            // 2. 生日贺卡内容（打字机效果）
            const birthdayContent = `🎂 亲爱的小伙伴，生日快乐！🎂

愿你的世界里，
星光温柔，晚风轻拂，
所有美好都如期而至。

愿你每一岁都奔走在热爱里，
平安喜乐，万事胜意，
眼里有光，心中有爱，
未来的日子闪闪发光！

愿友谊长存，
快乐无限，
生日安康，岁岁欢愉！
`;

            // 3. 修复进入贺卡功能（GitHub Pages核心修复）
            const enterBtn = document.getElementById('enterBtn');
            const contentWrapper = document.getElementById('contentWrapper');
            const birthdayText = document.getElementById('birthdayText');
            let isTyped = false;

            // 确保按钮
