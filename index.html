<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }
        /* 背景：黑色渐变灰色 + 流动星空 */
        body {
            background: linear-gradient(to bottom, #0a0a0a 0%, #222222 100%);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.5s;
        }
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            z-index: 0;
            animation: starFlow 60s linear infinite;
        }
        /* 首页进入按钮：灰色方框+白边无圆角 */
        #enterBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            background: #888;
            color: white;
            border: 2px solid white;
            border-radius: 0;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            z-index: 10;
        }
        #enterBtn:hover {
            background: #666;
        }
        /* 加载文字容器：宽度缩减+滚动+两侧对齐 */
        .text-container {
            position: relative;
            width: 450px;
            height: 300px;
            margin: 50px auto 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 20px;
            line-height: 1.8;
            overflow-y: auto;
            z-index: 5;
            text-align: left;
            white-space: pre-line; /* 新增：让换行符生效 */
        }
        .text-container::-webkit-scrollbar {
            width: 8px;
        }
        .text-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        /* 弹窗功能按钮：居中显示 */
        #popupBtn {
            display: block;
            margin: 0 auto 50px;
            padding: 12px 30px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
            position: relative;
        }
        #popupBtn:hover {
            background: #3182ce;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.3);
        }
        /* 弹窗样式：固定大小+柔和背景+关闭按钮 */
        .popup {
            position: fixed;
            width: 200px;
            height: 80px;
            padding: 15px;
            padding-top: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            color: #333;
            z-index: 1000;
            /* 兼容定位 */
            top: 0;
            left: 0;
        }
        /* 弹窗关闭按钮 */
        .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: rgba(0,0,0,0.1);
            color: #666;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-btn:hover {
            background: rgba(0,0,0,0.2);
            color: #333;
        }
        /* 隐藏内容容器（兼容旧浏览器） */
        .content-wrapper {
            display: none;
            visibility: hidden;
        }
        .content-wrapper.show {
            display: block;
            visibility: visible;
        }
        /* 星星动画 */
        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
        @keyframes starFlow {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
        }
    </style>
</head>
<body>
    <div id="stars"></div>
    <button id="enterBtn">点击进入</button>
    <div class="content-wrapper" id="contentWrapper">
        <div class="text-container" id="birthdayText"></div>
        <button id="popupBtn">看完上方内容点击我</button>
        <h>咏谢:豆包 and github </h>
    </div>
    <script>
        // 兼容处理：获取DOM元素（兼容旧浏览器）
        function getEl(id) {
            return document.getElementById(id) || document.all[id];
        }
        // 1. 生成流动星空
        const stars = getEl('stars');
        function createStars() {
            if (!stars) return;
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.width = `${Math.random() * 3 + 1}px`;
                star.style.height = star.style.width;
                star.style.backgroundColor = 'white';
                star.style.borderRadius = '50%';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                star.style.animation = 'twinkle ' + (Math.random() * 3 + 2) + 's infinite alternate';
                star.style.top = `${Math.random() * window.innerHeight * 2}px`;
                star.style.left = `${Math.random() * window.innerWidth}px`;
                stars.appendChild(star);
            }
        }
        createStars();
        // 2. 生日贺卡内容（打字机效果，添加\n实现换行）
        const birthdayContent = `宝宝生日快乐呀！祝你你天天开心，越来越可爱😋，往后少点烦恼和委屈。


不知觉我们认识了一年了，我很感谢你在我被别人嫌弃的时候，你却没有在意别人的眼光还愿意跟我玩。你的笑容佷治愈人，我每次与你聊天都非常开心！你是一个勇敢，坚忍的人，但是我希望你伤心难过的时候，你能和我分享或诉说，不要总是自己消化藏于心中。


End，这就是我为你准备的那份特殊的礼物，虽然并不是我自己写的，但我要学会的话是赶不上你的生日的，所以谅解一下。`;
        // 3. 进入贺卡功能（兼容所有浏览器）
        const enterBtn = getEl('enterBtn');
        const contentWrapper = getEl('contentWrapper');
        const birthdayText = getEl('birthdayText');
        let isTyped = false;
        // 兼容事件绑定
        function addEvent(el, type, handler) {
            if (el.addEventListener) {
                el.addEventListener(type, handler, false);
            } else if (el.attachEvent) {
                el.attachEvent('on' + type, handler);
            } else {
                el['on' + type] = handler;
            }
        }
        addEvent(enterBtn, 'click', function() {
            enterBtn.style.display = 'none';
            contentWrapper.className = 'content-wrapper show'; // 兼容显示
            if (!isTyped && birthdayText) {
                let index = 0;
                const typeInterval = setInterval(function() {
                    if (index < birthdayContent.length) {
                        birthdayText.textContent += birthdayContent[index];
                        index++;
                        birthdayText.scrollTop = birthdayText.scrollHeight;
                    } else {
                        clearInterval(typeInterval);
                        isTyped = true;
                    }
                }, 100);
            }
        });
        // 4. 弹窗功能：修复生成逻辑（兼容所有浏览器）
        const popupBtn = getEl('popupBtn');
        const popupTexts = [
            "生日快乐！",
            "新岁无忧，岁岁欢愉",
            "愿你被世界温柔以待",
            "平安喜乐，得偿所愿",
            "又长大一岁，继续发光",
            "解锁人生新章节，万事顺意",
            "美好和幸运都围绕着你",
            "生日安康，喜乐常伴",
            "今天你是主角，要超快乐",
            "梦想开花，未来可期",
            "温柔以待，好运常在"
        ];
        const softColors = [
            '#f0f8fb', '#f5fafe', '#fdf2f8', '#fef7fb',
            '#f5f5f5', '#f8f8f8', '#faf6ed', '#f7f3e9',
            '#eaf6fa', '#f0f8e8', '#fcf1f7', '#f5fafe'
        ];
        let isGenerating = false;
        let popupInterval;
        addEvent(popupBtn, 'click', function() {
            if (!isGenerating) {
                popupBtn.textContent = "停止";
                isGenerating = true;
                // 修复定时器：使用标准setInterval
                popupInterval = setInterval(function() {
                    createPopup();
                }, 1000);
            } else {
                popupBtn.textContent = "看完上方内容点击我";
                isGenerating = false;
                clearInterval(popupInterval);
            }
        });
        // 修复弹窗创建逻辑（兼容DOM操作）
        function createPopup() {
            // 创建弹窗元素（兼容所有浏览器）
            const popup = document.createElement('div');
            popup.className = 'popup';
            // 随机定位（覆盖全屏幕，含上方）
            const maxTop = window.innerHeight - 100;
            const maxLeft = window.innerWidth - 220;
            const randomTop = Math.floor(Math.random() * maxTop);
            const randomLeft = Math.floor(Math.random() * maxLeft);
            // 兼容样式设置
            popup.style.top = randomTop + 'px';
            popup.style.left = randomLeft + 'px';
            // 创建关闭按钮
            const closeBtn = document.createElement('button');
            closeBtn.className = 'close-btn';
            closeBtn.textContent = '×';
            addEvent(closeBtn, 'click', function() {
                popup.style.opacity = '0';
                popup.style.transition = 'opacity 0.5s';
                setTimeout(function() {
                    if (popup.parentNode) {
                        popup.parentNode.removeChild(popup); // 兼容删除
                    }
                }, 500);
            });
            // 随机祝福和背景色
            const textIndex = Math.floor(Math.random() * popupTexts.length);
            const colorIndex = Math.floor(Math.random() * softColors.length);
            popup.textContent = popupTexts[textIndex];
            popup.style.backgroundColor = softColors[colorIndex];
            // 添加关闭按钮和弹窗到页面
            popup.appendChild(closeBtn);
            document.body.appendChild(popup);
        }
        // 窗口大小变化时重新生成星星
        addEvent(window, 'resize', function() {
            if (stars) {
                stars.innerHTML = '';
                createStars();
            }
        });
    </script>
</body>
</html>
